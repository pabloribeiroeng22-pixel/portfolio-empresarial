  <rect x="110" y="270" width="36" height="100" rx="4" fill="url(#barGrad)"/>
  <rect x="164" y="320" width="36" height="50" rx="4" fill="url(#barGrad)"/>
  <rect x="218" y="250" width="36" height="120" rx="4" fill="url(#barGrad)"/>
  <rect x="272" y="290" width="36" height="80" rx="4" fill="url(#barGrad)"/>
  <rect x="326" y="260" width="36" height="110" rx="4" fill="url(#barGrad)"/>
  <rect x="380" y="310" width="36" height="60" rx="4" fill="url(#barGrad)"/>
  <line x1="44" y1="372" x2="424" y2="372" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="56"  y="380" width="36" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="110" y="380" width="36" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="164" y="380" width="36" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="218" y="380" width="36" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="272" y="380" width="36" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="326" y="380" width="36" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="380" y="380" width="36" height="6" rx="3" fill="#CBD5E1"/>

  <!-- donut chart panel -->
  <g filter="url(#cardShadow)">
    <rect x="456" y="196" width="200" height="200" rx="12" fill="#FFFFFF"/>
    <rect x="456" y="196" width="200" height="200" rx="12" fill="none" stroke="#E2E8F0"/>
  </g>
  <rect x="476" y="216" width="110" height="10" rx="3" fill="#334155"/>
  <g transform="translate(556,300)">
    <circle r="60" fill="none" stroke="#E2E8F0" stroke-width="22"/>
    <circle r="60" fill="none" stroke="#2563EB" stroke-width="22"
      stroke-dasharray="226 377" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="60" fill="none" stroke="#1D4ED8" stroke-width="22"
      stroke-dasharray="94 377" stroke-dashoffset="-226" transform="rotate(-90)"/>
    <circle r="60" fill="none" stroke="#94A3B8" stroke-width="22"
      stroke-dasharray="57 377" stroke-dashoffset="-320" transform="rotate(-90)"/>
    <text text-anchor="middle" y="8" font-size="22" font-weight="700" fill="#0F172A">60%</text>
  </g>
  <rect x="476" y="372" width="10" height="10" rx="2" fill="#2563EB"/>
  <rect x="536" y="372" width="10" height="10" rx="2" fill="#1D4ED8"/>
  <rect x="596" y="372" width="10" height="10" rx="2" fill="#94A3B8"/>

  <!-- line chart panel -->
  <g filter="url(#cardShadow)">
    <rect x="672" y="196" width="204" height="200" rx="12" fill="#FFFFFF"/>
    <rect x="672" y="196" width="204" height="200" rx="12" fill="none" stroke="#E2E8F0"/>
  </g>
  <rect x="692" y="216" width="120" height="10" rx="3" fill="#334155"/>
  <polyline points="692,340 722,320 752,335 782,290 812,300 842,260"
