  <circle cx="842" cy="260" r="5" fill="#1D4ED8"/>
  <line x1="692" y1="376" x2="862" y2="376" stroke="#E2E8F0" stroke-width="2"/>

  <!-- bottom table-like panel -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="412" width="852" height="128" rx="12" fill="#FFFFFF"/>
    <rect x="24" y="412" width="852" height="128" rx="12" fill="none" stroke="#E2E8F0"/>
  </g>
  <rect x="44" y="432" width="140" height="10" rx="3" fill="#334155"/>
  <line x1="44" y1="454" x2="852" y2="454" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="#CBD5E1">
    <rect x="44"  y="468" width="180" height="9" rx="3"/>
    <rect x="260" y="468" width="120" height="9" rx="3"/>
    <rect x="420" y="468" width="90"  height="9" rx="3"/>
    <rect x="550" y="468" width="130" height="9" rx="3"/>
    <rect x="720" y="468" width="100" height="9" rx="3"/>
  </g>
  <g fill="#E2E8F0">
    <rect x="44"  y="490" width="180" height="9" rx="3"/>
    <rect x="260" y="490" width="120" height="9" rx="3"/>
    <rect x="420" y="490" width="90"  height="9" rx="3"/>
    <rect x="550" y="490" width="130" height="9" rx="3"/>
    <rect x="720" y="490" width="100" height="9" rx="3"/>
  </g>
  <g fill="#E2E8F0">
    <rect x="44"  y="512" width="180" height="9" rx="3"/>
    <rect x="260" y="512" width="120" height="9" rx="3"/>
    <rect x="420" y="512" width="90"  height="9" rx="3"/>
    <rect x="550" y="512" width="130" height="9" rx="3"/>
    <rect x="720" y="512" width="100" height="9" rx="3"/>
  </g>
</svg>
