<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="560" fill="#F8FAFC"/>

  <!-- top bar -->
  <rect x="0" y="0" width="900" height="56" fill="#0F172A"/>
  <circle cx="30" cy="28" r="7" fill="#2563EB"/>
  <rect x="46" y="21" width="150" height="14" rx="3" fill="#E2E8F0" opacity="0.85"/>
  <rect x="700" y="18" width="66" height="20" rx="10" fill="#1D4ED8"/>
  <rect x="780" y="18" width="66" height="20" rx="10" fill="rgba(255,255,255,0.12)"/>

  <!-- KPI cards row -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="80" width="200" height="96" rx="12" fill="#FFFFFF"/>
    <rect x="24" y="80" width="200" height="96" rx="12" fill="none" stroke="#E2E8F0"/>
  </g>
  <rect x="44" y="100" width="90" height="10" rx="3" fill="#94A3B8"/>
  <text x="44" y="145" font-size="30" font-weight="700" fill="#0F172A">128</text>
  <rect x="44" y="156" width="60" height="8" rx="3" fill="#22C55E"/>

  <g filter="url(#cardShadow)">
    <rect x="240" y="80" width="200" height="96" rx="12" fill="#FFFFFF"/>
    <rect x="240" y="80" width="200" height="96" rx="12" fill="none" stroke="#E2E8F0"/>
  </g>
  <rect x="260" y="100" width="90" height="10" rx="3" fill="#94A3B8"/>
  <text x="260" y="145" font-size="30" font-weight="700" fill="#0F172A">87%</text>
  <rect x="260" y="156" width="140" height="8" rx="3" fill="#E2E8F0"/>
  <rect x="260" y="156" width="120" height="8" rx="3" fill="#2563EB"/>

  <g filter="url(#cardShadow)">
    <rect x="456" y="80" width="200" height="96" rx="12" fill="#FFFFFF"/>
    <rect x="456" y="80" width="200" height="96" rx="12" fill="none" stroke="#E2E8F0"/>
  </g>
  <rect x="476" y="100" width="90" height="10" rx="3" fill="#94A3B8"/>
  <text x="476" y="145" font-size="30" font-weight="700" fill="#0F172A">14</text>
  <rect x="476" y="156" width="60" height="8" rx="3" fill="#F59E0B"/>

  <g filter="url(#cardShadow)">
    <rect x="672" y="80" width="204" height="96" rx="12" fill="#FFFFFF"/>
    <rect x="672" y="80" width="204" height="96" rx="12" fill="none" stroke="#E2E8F0"/>
  </g>
  <rect x="692" y="100" width="90" height="10" rx="3" fill="#94A3B8"/>
  <text x="692" y="145" font-size="30" font-weight="700" fill="#0F172A">4,2</text>
  <rect x="692" y="156" width="60" height="8" rx="3" fill="#2563EB"/>

  <!-- bar chart panel -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="196" width="420" height="200" rx="12" fill="#FFFFFF"/>
    <rect x="24" y="196" width="420" height="200" rx="12" fill="none" stroke="#E2E8F0"/>
  </g>
  <rect x="44" y="216" width="130" height="10" rx="3" fill="#334155"/>
